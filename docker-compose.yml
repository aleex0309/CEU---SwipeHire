version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swipehire_backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped

  frontend:
    build:
      context: ./swipehire
      dockerfile: Dockerfile
    container_name: swipehire_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
